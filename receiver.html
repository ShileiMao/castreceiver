<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>ShileiCast Receiver</title>
  <script src="//www.gstatic.com/cast/sdk/libs/caf_receiver/v3/cast_receiver_framework.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #0a0a0f; color: #fff; font-family: monospace; height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; overflow: hidden; }

    /* Animated background gradient */
    body::before {
      content: '';
      position: fixed; inset: 0;
      background: radial-gradient(ellipse at 20% 50%, #1a003a 0%, transparent 60%),
                  radial-gradient(ellipse at 80% 50%, #003a1a 0%, transparent 60%);
      animation: bgshift 6s ease-in-out infinite alternate;
      z-index: 0;
    }
    @keyframes bgshift {
      from { opacity: 0.6; }
      to   { opacity: 1; }
    }

    .container { position: relative; z-index: 1; text-align: center; width: 100%; padding: 40px; }

    /* Pulsing ring */
    .ring {
      width: 180px; height: 180px;
      border-radius: 50%;
      border: 4px solid rgba(0,255,120,0.15);
      margin: 0 auto 40px;
      position: relative;
      animation: spin 8s linear infinite;
    }
    .ring::before, .ring::after {
      content: '';
      position: absolute; inset: 12px;
      border-radius: 50%;
      border: 2px solid transparent;
    }
    .ring::before {
      border-top-color: #00ff78;
      border-right-color: #00ff78;
      animation: spin 2s linear infinite;
    }
    .ring::after {
      border-bottom-color: #00aaff;
      border-left-color: #00aaff;
      animation: spin 3s linear infinite reverse;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    /* Dot in center of ring */
    .dot {
      position: absolute; top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      width: 24px; height: 24px;
      border-radius: 50%;
      background: #00ff78;
      box-shadow: 0 0 20px #00ff78, 0 0 40px #00ff7844;
      animation: pulse 2s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { transform: translate(-50%,-50%) scale(1); opacity: 1; }
      50%       { transform: translate(-50%,-50%) scale(1.4); opacity: 0.6; }
    }

    .title { font-size: 2rem; font-weight: bold; letter-spacing: 0.15em; color: #00ff78; margin-bottom: 8px; }
    .version { font-size: 0.75rem; color: #444; letter-spacing: 0.1em; margin-bottom: 40px; }

    #status {
      font-size: 1.1rem; color: #00ff78;
      background: rgba(0,255,120,0.08);
      border: 1px solid rgba(0,255,120,0.2);
      border-radius: 8px;
      padding: 14px 28px;
      display: inline-block;
      min-width: 420px;
      letter-spacing: 0.05em;
      transition: all 0.4s ease;
    }
    #status.active {
      color: #00aaff;
      border-color: rgba(0,170,255,0.4);
      background: rgba(0,170,255,0.08);
      box-shadow: 0 0 24px rgba(0,170,255,0.15);
    }

    video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: contain; background: #000; display: none; z-index: 10; }

    /* While streaming: remove the splash entirely so the Chromecast GPU/CPU only
       composites the video. The animations above (full-screen gradient, spinning
       ring, box-shadow pulse) otherwise keep repainting behind the video and
       starve decode/render → visible lag. */
    body.streaming { background: #000; }
    body.streaming::before { display: none; animation: none; }
    body.streaming .container { display: none; }
    body.streaming .container * { animation: none; }

    #stats {
      position: fixed; left: 12px; bottom: 12px; z-index: 11;
      font-size: 0.8rem; color: #0f0; background: rgba(0,0,0,0.6);
      padding: 4px 8px; border-radius: 4px; display: none; white-space: pre;
    }
    body.streaming #stats { display: block; }
  </style>
</head>
<body>
<div class="container">
  <div class="ring"><div class="dot"></div></div>
  <div class="title">ShileiCast</div>
  <div class="version">v0.2.6 · 2026-11-19 · Cast Custom Channel · lag diagnostics</div>
  <div id="status">Status: loading…</div>
</div>
<video id="remote" autoplay playsinline muted></video>
<div id="stats"></div>

<script>
  
    const NAMESPACE = 'urn:x-cast:com.shilei.cast.webrtc';
    const statusEl  = document.getElementById('status');
    const video     = document.getElementById('remote');

    function setStatus(text, active) {
        statusEl.textContent = text;
        statusEl.className = active ? 'active' : '';
    }

    // ── Cast Receiver SDK ─────────────────────────────────────────────────
    const context = cast.framework.CastReceiverContext.getInstance();

    context.getPlayerManager().setMessageInterceptor(
        cast.framework.messages.MessageType.LOAD,
        () => null
    );

    // ── WebRTC ────────────────────────────────────────────────────────────
    let peer     = null;
    let senderId = null;

    // ── Latency stats overlay (bottom-left while streaming) ────────────────
    // Shows what the TV is actually doing so latency regressions are visible:
    // fps, resolution, jitter-buffer delay, decode time, dropped frames, and
    // whether ICE picked UDP (good) or TCP (adds latency).
    let statsTimer = null;
    const statsEl = document.getElementById('stats');
    // All numbers are over the LAST 2 s interval (not lifetime averages), so a
    // queue that builds up over time shows as a value that keeps climbing.
    let lastIn = null;      // previous inbound-rtp snapshot
    let lagStart = null;    // first "lag" reading, to compare against

    async function updateStats(p) {
        try {
            const report = await p.getStats();
            let inbound = null, pair = null;
            const byId = new Map();
            report.forEach(s => {
                byId.set(s.id, s);
                if (s.type === 'inbound-rtp' && s.kind === 'video') inbound = s;
                if (s.type === 'candidate-pair' && s.nominated && s.state === 'succeeded') pair = s;
            });
            const lines = [];
            if (inbound) {
                const prev = lastIn;
                lastIn = {
                    t: inbound.timestamp, recv: inbound.framesReceived || 0,
                    dec: inbound.framesDecoded || 0, drop: inbound.framesDropped || 0,
                    decTime: inbound.totalDecodeTime || 0, bytes: inbound.bytesReceived || 0,
                    jb: inbound.jitterBufferDelay || 0, jbN: inbound.jitterBufferEmittedCount || 0,
                    proc: inbound.totalProcessingDelay || 0,
                };
                lines.push(`${inbound.frameWidth || '?'}x${inbound.frameHeight || '?'}`);
                if (prev) {
                    const cur = lastIn, dt = (cur.t - prev.t) / 1000 || 2;
                    const dDec = cur.dec - prev.dec;
                    const per = (a, n) => n > 0 ? (1000 * a / n).toFixed(0) : '-';
                    const recvFps = ((cur.recv - prev.recv) / dt).toFixed(0);
                    const decFps  = (dDec / dt).toFixed(0);
                    const mbps    = ((cur.bytes - prev.bytes) * 8 / dt / 1e6).toFixed(2);
                    const jbMs    = per(cur.jb - prev.jb, cur.jbN - prev.jbN);
                    const decMs   = per(cur.decTime - prev.decTime, dDec);
                    // processing delay = packet arrival -> frame decoded (jitter buffer + decode)
                    const lagMs   = per(cur.proc - prev.proc, dDec);
                    if (lagStart === null && lagMs !== '-') lagStart = lagMs;
                    lines.push(`in ${recvFps} fps · decoded ${decFps} fps · dropped +${cur.drop - prev.drop} · ${mbps} Mbps`);
                    lines.push(`jitter buf ${jbMs} ms · decode ${decMs} ms`);
                    lines.push(`lag now ${lagMs} ms (start ${lagStart ?? '-'} ms)`);
                }
            }
            if (pair) {
                const local = byId.get(pair.localCandidateId);
                const rtt = pair.currentRoundTripTime != null
                    ? (pair.currentRoundTripTime * 1000).toFixed(0) + ' ms' : '-';
                lines.push(`net ${local ? local.protocol : '?'} · rtt ${rtt}`);
            }
            statsEl.textContent = lines.join('\n');
        } catch (e) { /* stats are best-effort */ }
    }

    function exitStreaming() {
        document.body.classList.remove('streaming');
        video.style.display = 'none';
        if (statsTimer) { clearInterval(statsTimer); statsTimer = null; }
    }

    function createPeer() {
        const p = new RTCPeerConnection({ iceServers: [] });

        p.ontrack = (event) => {
            // Ask Chrome to keep the jitter buffer as small as possible.
            // jitterBufferTarget (newer Chrome) and playoutDelayHint (older
            // Cast firmware) are both hints; unsupported ones are ignored.
            try {
                if ('jitterBufferTarget' in event.receiver) event.receiver.jitterBufferTarget = 0;
                if ('playoutDelayHint' in event.receiver) event.receiver.playoutDelayHint = 0;
            } catch (e) { console.warn('latency hint not applied:', e); }

            setStatus('Status: track received — playing', true);
            video.srcObject = event.streams.length > 0
                ? event.streams[0]
                : new MediaStream([event.track]);
            video.style.display = 'block';
            document.body.classList.add('streaming');
            video.play().catch(e => console.error('play() failed:', e));

            if (statsTimer) clearInterval(statsTimer);
            lastIn = null;
            lagStart = null;
            statsTimer = setInterval(() => updateStats(p), 2000);
        };

        p.onconnectionstatechange = () => {
            const s = p.connectionState;
            setStatus('Status: ICE ' + s, s === 'connected');
            if (s === 'failed' || s === 'closed' || s === 'disconnected') exitStreaming();
        };

        p.onicecandidate = (e) => {
            if (e.candidate && senderId) {
                // Pass object directly — CAF v3 serializes it; JSON.stringify causes double-encoding
                context.sendCustomMessage(NAMESPACE, senderId,
                    { type: 'candidate', candidate: e.candidate });
            }
        };

        return p;
    }

    // ── Cast Custom Channel ───────────────────────────────────────────────
    context.addCustomMessageListener(NAMESPACE, async (event) => {
        try {
            senderId = event.senderId;
            // CAF v3 auto-parses JSON; event.data is already an object
            const msg = (typeof event.data === 'string') ? JSON.parse(event.data) : event.data;
            // Show immediately so we know the message arrived even if processing fails
            setStatus('Status: msg received — type: ' + msg.type, true);

            if (msg.type === 'offer') {
                setStatus('Status: offer received — negotiating…', true);
                // A new offer replaces any previous connection (e.g. Stop → Start again)
                if (peer) { peer.close(); exitStreaming(); }
                peer = createPeer();
                await peer.setRemoteDescription(new RTCSessionDescription(msg));
                const answer = await peer.createAnswer();
                await peer.setLocalDescription(answer);
                // Pass object directly — CAF v3 serializes it; JSON.stringify causes double-encoding
                context.sendCustomMessage(NAMESPACE, senderId,
                    { type: 'answer', sdp: answer.sdp });
                setStatus('Status: answer sent — waiting for ICE…', true);
            } else if (msg.type === 'candidate' && peer) {
                await peer.addIceCandidate(new RTCIceCandidate(msg.candidate));
            }
        } catch(e) {
            setStatus('❌ JS error: ' + e.message);
            console.error('message handler error:', e);
        }
    });

    // ── Start Cast session ────────────────────────────────────────────────
    window.addEventListener('load', () => {
        try {
            const options = new cast.framework.CastReceiverOptions();
            options.disableIdleTimeout = true;
            context.start(options);
            setStatus('Status: Cast ready — waiting for stream');
        } catch(e) {
            setStatus('Cast error: ' + e.message);
            console.error(e);
        }
    });
</script>
</body>
</html>
